name: Publicar AISUNI (Jekyll)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Compilar Markdown con Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verificar contenido generado
        run: python3 scripts/verify_build.py _site

      - name: Guardar sitio publicado
        uses: actions/upload-pages-artifact@v3

      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
