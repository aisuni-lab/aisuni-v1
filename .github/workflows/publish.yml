name: Publicar AISUNI (Jekyll)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Compilar Markdown con Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verificar que Markdown se compiló y que las imágenes existen
        run: python3 scripts/verify_build.py _site
      - name: Guardar sitio publicado
        uses: actions/upload-pages-artifact@v3
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
